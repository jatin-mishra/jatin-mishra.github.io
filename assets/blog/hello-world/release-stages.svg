<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d" font-family="Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Three stages where a bad release can be stopped</title>
  <desc id="d">Offline evals before merge, canary traffic after deploy, and monitoring in production. The cost of catching a problem rises from left to right.</desc>
  <rect width="880" height="330" fill="#0d1226"/>

  <!-- stage cards -->
  <g>
    <rect x="40" y="48" width="240" height="170" rx="18" fill="#141b3a" stroke="#34c57b" stroke-opacity=".7" stroke-width="1.5"/>
    <circle cx="72" cy="82" r="13" fill="#34c57b"/>
    <text x="72" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#06301a">1</text>
    <text x="96" y="88" font-size="19" font-weight="600" fill="#ffffff">Offline evals</text>
    <text x="64" y="126" font-size="14.5" fill="#b9c2de">Runs in CI, before merge</text>
    <text x="64" y="150" font-size="14.5" fill="#b9c2de">Fixed dataset + judges</text>
    <text x="64" y="190" font-size="13" font-weight="600" fill="#8de7b8" letter-spacing=".6">BLOCKS THE RELEASE</text>
  </g>
  <g>
    <rect x="320" y="48" width="240" height="170" rx="18" fill="#141b3a" stroke="#f0b43c" stroke-opacity=".7" stroke-width="1.5"/>
    <circle cx="352" cy="82" r="13" fill="#f0b43c"/>
    <text x="352" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#3d2a00">2</text>
    <text x="376" y="88" font-size="19" font-weight="600" fill="#ffffff">Canary traffic</text>
    <text x="344" y="126" font-size="14.5" fill="#b9c2de">Small share of real users</text>
    <text x="344" y="150" font-size="14.5" fill="#b9c2de">Tool errors, latency, cost</text>
    <text x="344" y="190" font-size="13" font-weight="600" fill="#f6cf7a" letter-spacing=".6">ROLLS BACK</text>
  </g>
  <g>
    <rect x="600" y="48" width="240" height="170" rx="18" fill="#141b3a" stroke="#7b61ff" stroke-opacity=".8" stroke-width="1.5"/>
    <circle cx="632" cy="82" r="13" fill="#7b61ff"/>
    <text x="632" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <text x="656" y="88" font-size="19" font-weight="600" fill="#ffffff">Production</text>
    <text x="624" y="126" font-size="14.5" fill="#b9c2de">All traffic, traced end to end</text>
    <text x="624" y="150" font-size="14.5" fill="#b9c2de">Alerts on error budget</text>
    <text x="624" y="190" font-size="13" font-weight="600" fill="#c4b8ff" letter-spacing=".6">PAGES THE ON-CALL</text>
  </g>

  <!-- connectors -->
  <g stroke="#8fa6ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 133h26m-7-6 7 6-7 6"/>
    <path d="M566 133h26m-7-6 7 6-7 6"/>
  </g>

  <!-- cost axis -->
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#34c57b"/><stop offset=".5" stop-color="#f0b43c"/><stop offset="1" stop-color="#7b61ff"/>
    </linearGradient>
  </defs>
  <rect x="40" y="262" width="800" height="5" rx="2.5" fill="url(#g)"/>
  <text x="40" y="296" font-size="13.5" fill="#8f9abb">Cheap to catch</text>
  <text x="440" y="296" text-anchor="middle" font-size="13.5" fill="#8f9abb">Cost of catching a bad release</text>
  <text x="840" y="296" text-anchor="end" font-size="13.5" fill="#8f9abb">Expensive to catch</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
